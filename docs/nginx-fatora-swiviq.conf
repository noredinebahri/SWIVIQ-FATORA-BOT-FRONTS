# fatora.swiviq.com — landing Fatora-Bot (Angular SSR port 4300)
# HTTP en attendant le DNS GoDaddy (A fatora -> 164.68.103.166), puis certbot --nginx
server {
    server_name fatora.swiviq.com;
    server_tokens off;

    # SEO / sécurité / performance
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml application/xml;

    # Cache long pour les fichiers versionnés et les images
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|webp|avif)$ {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ^~ /p/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fatora.swiviq.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fatora.swiviq.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = fatora.swiviq.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name fatora.swiviq.com;
    return 404; # managed by Certbot


}
