<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Fatora-Bot</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8b64c">
  <!-- Icônes : SVG pour les navigateurs modernes, PNG et .ico en repli.
       Générées par `node scripts/logo.js` à partir d'une source unique. -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml">
  <!-- Polices auto-hébergées : les @font-face sont dans le bundle CSS, on ne
       précharge ici que les deux fichiers du premier écran (titre + texte). -->
  <link rel="preload" href="/fonts/sora-800-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <app-root></app-root>
</body>
</html>
